# Docker Compose para Análisis Estático y Auditoría de Código (SonarQube)
# Entorno local independiente de la base de datos XAMPP
#
# Uso:
#   docker compose -f docker-compose.sonar.yml up -d
# Acceso web:
#   http://localhost:9000
# Credenciales por defecto:
#   Usuario: admin
#   Contraseña: admin

services:
  sonarqube:
    image: sonarqube:lts-community
    container_name: transigovai-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      # Deshabilita los chequeos de bootstrap de Elasticsearch para despliegue local ágil (Docker Desktop)
      - SONAR_ES_BOOTSTRAP_CHECKS_DISABLE=true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs

volumes:
  sonarqube_data:
    name: transigovai_sonar_data
  sonarqube_extensions:
    name: transigovai_sonar_extensions
  sonarqube_logs:
    name: transigovai_sonar_logs
