spring.application.name=mtc-java-service
server.port=${PORT:8080}

# Conexión a Base de Datos MySQL (Por defecto XAMPP local: puerto 3306, user: root, pass: vacía)
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:marcona_permisos}?useUnicode=true&characterEncoding=utf8&serverTimezone=America/Lima}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never

# Configuración de Aplicación y Entorno
app.environment=${APP_ENV:development}
app.jwt-secret=${JWT_SECRET:${_SECRET:dev_only_change_me}}
app.-secret=${_SECRET:${JWT_SECRET:dev_only_change_me}}
app.jwt-expiry-seconds=${JWT_EXPIRY:${_EXPIRY:86400}}
app.-expiry-seconds=${_EXPIRY:${JWT_EXPIRY:86400}}
app.audit-file=${APP_AUDIT_FILE:logs/database-audit.jsonl}
app.api-url=${API_URL:http://localhost:8080}
app.uploads-dir=${UPLOADS_DIR:uploads}

# Configuración de Carga de Archivos
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB
server.tomcat.max-part-count=200
server.tomcat.max-part-header-size=4096
server.tomcat.max-parameter-count=10000

# Logs
logging.level.root=INFO
logging.level.pe.marcona.mtc=INFO
